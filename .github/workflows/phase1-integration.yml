name: Saviora Phase 1 frontend integration

on:
  push:
    branches: [itcyber-development]
    paths:
      - "phase1/functional-frontend-implementation.patch"
      - ".github/workflows/phase1-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Unpack the archived Saviora source
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/import-payload || { echo "Archive chunks absent"; exit 1; }
          mkdir -p /tmp/saviora-source
          cat .github/import-payload/chunk-*.b64 | base64 --decode | xz -dc > /tmp/saviora-source.decoded
          echo "Archive type: $(file -b /tmp/saviora-source.decoded)"
          if tar -tf /tmp/saviora-source.decoded >/dev/null 2>&1; then
            tar -xf /tmp/saviora-source.decoded -C /tmp/saviora-source --no-same-owner --no-same-permissions
          elif unzip -t /tmp/saviora-source.decoded >/dev/null 2>&1; then
            unzip -q /tmp/saviora-source.decoded -d /tmp/saviora-source
          else
            echo "The imported archive is neither TAR nor ZIP."
            exit 1
          fi
          SOURCE_PACKAGE=$(find /tmp/saviora-source -type f -name package.json -not -path '*/node_modules/*' -print -quit)
          test -n "$SOURCE_PACKAGE" || { echo "No package.json found in archived source."; exit 1; }
          SOURCE_DIR=$(dirname "$SOURCE_PACKAGE")
          echo "Restoring original repository from: $SOURCE_DIR"
          rsync -a "$SOURCE_DIR/" "$GITHUB_WORKSPACE/" \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.vercel' \
            --exclude '.env' --exclude '.env.local' --exclude '.env.production' \
            --exclude '.env.development' --exclude '*.pem' --exclude '*.key'
      - name: Apply Phase 1 functional frontend updates
        shell: bash
        run: |
          set -euo pipefail
          git apply --check phase1/functional-frontend-implementation.patch
          git apply phase1/functional-frontend-implementation.patch
          test -f components/frontend/demo-store.tsx
          test -f "app/(doctor)/page.tsx"
          test -f package.json
          echo "Frontend integration patch applied successfully."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Phase 1 frontend checks
        run: |
          npm run check:frontend
          npm run smoke:phase1
      - name: Commit complete Phase 1 source (never main)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "itcyber-development"
          git config user.name "ITCYBER Technologies"
          git config user.email "55291817+kautukade@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "feat(frontend): Phase 1 - Complete Saviora Functional Responsive Frontend"
            git push origin HEAD:itcyber-development
          fi
